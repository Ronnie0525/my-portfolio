<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Works — Portfolio — Ronnie Balonon</title>
  <meta name="description" content="Full photography portfolio of Ronnie Balonon — food, beverage, coffee and portrait photography." />
  <link rel="stylesheet" href="/css/styles.css?v=32" />
  <script src="/js/main.js?v=32" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <ol class="breadcrumb"><li><a href="/">Home</a></li><li><a href="/portfolio/">Portfolio</a></li><li>Photography</li></ol>
        <p class="eyebrow">Portfolio</p>
        <h1>Photography Works</h1>
        <p>Food, beverage, coffee and portrait photography.</p>
        <div class="btn-row"><a class="btn btn--outline-light" href="/portfolio/">← Back to Portfolio</a></div>
      </div>
    </section>

    <section class="section">
      <div class="container" data-filter-group>
        <div class="filterbar reveal" role="tablist" aria-label="Filter photography by category">
          <button class="filter-btn active" type="button" data-filter="all" aria-selected="true">All <span class="count">16</span></button>
          <button class="filter-btn" type="button" data-filter="portrait" aria-selected="false">Portrait <span class="count">4</span></button>
          <button class="filter-btn" type="button" data-filter="food" aria-selected="false">Food <span class="count">6</span></button>
          <button class="filter-btn" type="button" data-filter="beverage" aria-selected="false">Beverage <span class="count">5</span></button>
          <button class="filter-btn" type="button" data-filter="coffee" aria-selected="false">Coffee <span class="count">1</span></button>
        </div>
        <div class="work-grid work-grid--square reveal">
          <article class="work-tile" data-category="portrait"><img class="shot" src="/assets/photography/portrait-1.jpg" alt="Portrait photography by Ronnie Balonon" loading="lazy" /></article>
          <article class="work-tile" data-category="portrait"><img class="shot" src="/assets/photography/portrait-2.jpg" alt="Creative portrait composition" loading="lazy" /></article>
          <article class="work-tile" data-category="portrait"><img class="shot" src="/assets/photography/portrait-3.jpg" alt="Portrait photography session" loading="lazy" /></article>
          <article class="work-tile" data-category="portrait"><img class="shot" src="/assets/photography/portrait-4.jpg" alt="Portrait photography by Ronnie Balonon" loading="lazy" /></article>
          <article class="work-tile" data-category="food"><img class="shot" src="/assets/photography/food-1.jpg" alt="Food photography by Ronnie Balonon" loading="lazy" /></article>
          <article class="work-tile" data-category="food"><img class="shot" src="/assets/photography/food-2.jpg" alt="Plated dish food photography" loading="lazy" /></article>
          <article class="work-tile" data-category="food"><img class="shot" src="/assets/photography/food-3.jpg" alt="Styled food photography" loading="lazy" /></article>
          <article class="work-tile" data-category="food"><img class="shot" src="/assets/photography/food-4.jpg" alt="Restaurant food photography" loading="lazy" /></article>
          <article class="work-tile" data-category="food"><img class="shot" src="/assets/photography/food-5.jpg" alt="Food photography close-up" loading="lazy" /></article>
          <article class="work-tile" data-category="food"><img class="shot" src="/assets/photography/food-6.jpg" alt="Food photography for menu" loading="lazy" /></article>
          <article class="work-tile" data-category="beverage"><img class="shot" src="/assets/photography/beverage-1.jpg" alt="Beverage photography by Ronnie Balonon" loading="lazy" /></article>
          <article class="work-tile" data-category="beverage"><img class="shot" src="/assets/photography/beverage-2.jpg" alt="Drink photography with fresh detail" loading="lazy" /></article>
          <article class="work-tile" data-category="beverage"><img class="shot" src="/assets/photography/beverage-3.jpg" alt="Beverage photography" loading="lazy" /></article>
          <article class="work-tile" data-category="beverage"><img class="shot" src="/assets/photography/beverage-4.jpg" alt="Refreshing beverage photography" loading="lazy" /></article>
          <article class="work-tile" data-category="beverage"><img class="shot" src="/assets/photography/beverage-5.jpg" alt="Beverage photography styling" loading="lazy" /></article>
          <article class="work-tile" data-category="coffee"><img class="shot" src="/assets/photography/coffee-1.jpg" alt="Coffee photography by Ronnie Balonon" loading="lazy" /></article>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container"><div class="cta-band reveal">
        <h2>Let's capture your brand</h2>
        <p>From products to events, let's create images that tell your story beautifully.</p>
        <div class="btn-row" data-cta-buttons></div>
        <div class="cta-contact" data-cta-contact></div>
      </div></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
